---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote-app-deployment
  labels:
    app: vote-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vote-app
  template:
    metadata:
      labels:
        app: vote-app
    spec:
      containers:
        - name: vote-app-container
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 3000
          env:
            - name: SQLALCHEMY_DATABASE_URI
              value: "mysql+pymysql://admin:admin123@database-1.c38cueauyeoe.us-east-1.rds.amazonaws.com/ecommerce"

---
apiVersion: v1
kind: Service
metadata:
  name: vote-app-service
spec:
  type: LoadBalancer
  selector:
    app: vote-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
